name: dutygraph-v2
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dutygraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    ports: ["127.0.0.1:55437:5432"]
    volumes: ["dutygraph-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dutygraph"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  dutygraph-data:
