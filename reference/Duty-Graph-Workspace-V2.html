        </div></div>
       <div class="graph-surface" tabindex="0" role="region" aria-label="Pan and zoom the company graph" aria-describedby="graph-interaction-help">${g.markup}
         <div class="graph-map-wrap"><span class="graph-map-label">MAP OVERVIEW</span><button class="graph-minimap" aria-label="Recenter graph using overview map" title="Click to recenter. Keyboard: fit all nodes."><svg viewBox="0 0 ${g.width} ${g.height}" aria-hidden="true">${g.nodes.map(n=>`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="7" fill="${n.type==='risk'?'var(--amber-bg)':n.type==='evidence'?'var(--blue-bg)':'var(--soft)'}" stroke="${n.type==='risk'?'var(--amber)':'var(--node-border)'}" stroke-width="5"/>`).join('')}<rect class="minimap-window" fill="var(--focus)" fill-opacity=".06" stroke="var(--focus)" stroke-width="8" rx="8"/></svg></button></div>
       </div>
       <div class="graph-help">${legend}<span class="graph-instructions" id="graph-interaction-help">Drag to pan · Ctrl/⌘ + scroll to zoom · 0 to fit</span></div>
       <div class="graph-note">${icon('help')}<span>${note}</span><span>Local graph · Neo4j not connected</span></div>
      </section>`+
      (view==='connected'&&selected?`<section class="graph-detail"><span class="agent-emblem">${icon(selected.icon)}</span><div class="grow"><div class="eyebrow">${esc(selected.kind)}</div><h3>${esc(selected.name)}</h3><p>${esc(selected.text)}</p></div>${btn('Open record',selected.action,selected.target,'','arrow')}</section>`:'');
  };

  smallConnectedGraph = function() {
    return `<svg viewBox="0 0 340 168" role="img" aria-label="Evidence, human ownership, task, agent and authority"><defs><pattern id="mini-grid-v2" width="17" height="17" patternUnits="userSpaceOnUse"><circle class="mini-dot" cx="1" cy="1" r=".7"/></pattern></defs><rect width="340" height="168" fill="url(#mini-grid-v2)"/><g class="mini-edge"><path d="M70 50C125 50 125 80 168 80M70 133C125 133 125 80 168 80M168 80C235 80 229 45 273 45M168 80C235 80 229 132 273 132"/></g>${[[22,34,93,33,'Evidence',0],[22,116,93,33,'Human owner',0],[128,61,94,39,'Task card',1],[240,28,88,33,'Agent',0],[240,114,88,33,'Authority',0]].map(n=>`<rect class="${n[5]?'mini-core':'mini-box'}" x="${n[0]}" y="${n[1]}" width="${n[2]}" height="${n[3]}" rx="6"/><text x="${n[0]+n[2]/2}" y="${n[1]+n[3]/2+4}" text-anchor="middle" font-size="10">${n[4]}</text>`).join('')}</svg>`;
  };

  actions['team-detail'] = function(team) {
    const people=E().people.filter(p=>p.team===team);
    const tasks=activeTasks().filter(t=>t.team===team);
    modal(team,'FUNCTION IN THE DISCOVERY SCOPE',
      `<div class="notice blue">${icon('users')}<span>This groups the recorded work by team. It does not verify reporting lines or grant authority.</span></div>
       <h3 class="mt24">Participants</h3>${people.map(p=>`<div class="task-row">${avatar(p)}<div class="grow"><h3>${esc(p.name)}</h3><p>${esc(p.role)}</p></div>${btn('View','person-detail',p.id,'sm','arrow')}</div>`).join('')}
       <h3 class="mt24">Tasks in this scope</h3>${tasks.map(t=>`<div class="task-row"><div class="grow"><h3>${esc(t.name)}</h3><div class="mt8">${badge(...taskStatus(t))}</div></div>${btn('Inspect','task',t.id,'sm','arrow')}</div>`).join('')||'<p class="small muted mt12">No tasks recorded for this team yet.</p>'}`,
      btn('Close','close-modal','',''),false,true);
  };

  function graphKey() {return E().id+':'+WX.graphView;}
  function setExpanded(expanded) {
    const stage=document.querySelector('.graph-stage');if(!stage)return;
    graphExpanded=expanded;
    if(expanded) { rememberedBodyOverflow=document.body.style.overflow; document.body.style.overflow='hidden'; }
    else document.body.style.overflow=rememberedBodyOverflow;
    stage.classList.toggle('is-expanded',expanded);
    stage.setAttribute('role',expanded?'dialog':'region');
    if(expanded){stage.setAttribute('aria-modal','true');stage.querySelector('.graph-surface')?.focus({preventScroll:true});}
    else stage.removeAttribute('aria-modal');
    const button=stage.querySelector('.graph-expand');
    if(button) {button.innerHTML=icon(expanded?'collapse':'expand');button.setAttribute('aria-label',expanded?'Collapse graph':'Expand graph');button.title=expanded?'Collapse (Esc)':'Expand graph';}
    requestAnimationFrame(()=>{if(liveCamera)liveCamera.apply();});
  }
  actions['graph-expand'] = () => setExpanded(!graphExpanded);
  actions['connected-view'] = id => {
    if(!['connected','work','org'].includes(id))return;
    WX.graphView=id;render();
  };
  actions['connected-zoom'] = id => {
    if(!liveCamera)return;
    if(id==='fit')liveCamera.fit();
    else liveCamera.zoomBy(id==='in'?1.25:1/1.25);
  };

  function initViewport() {
    disposeViewport(); liveCamera=null;
    const surface=document.querySelector('.graph-surface');
    const svg=surface?.querySelector(':scope > svg.dg-canvas');
    if(!svg)return;
    if(graphExpanded){const stage=surface.closest('.graph-stage');stage.setAttribute('role','dialog');stage.setAttribute('aria-modal','true');document.body.style.overflow='hidden';}
    const width=Number(svg.dataset.naturalWidth),height=Number(svg.dataset.naturalHeight);
    const key=graphKey();
    let c=cameraStates.get(key);
    if(!c||c.width!==width||c.height!==height) {
      // On a narrow phone, start at a readable detail level. Fit remains an
      // explicit overview control; touch drag/pinch and the minimap explore it.
      const narrow=surface.clientWidth<500;
      c={cx:width/2,cy:height/2,z:narrow?2.6:1,width,height};cameraStates.set(key,c);
    }
    const controller=new AbortController();
    const opts={signal:controller.signal};
    const pointers=new Map();
    let pinch=null,drag=null,moved=false;
    function geometry() {
      const r=surface.getBoundingClientRect();
      const padding=r.width<600?24:36;
      const scale=Math.max(.001,Math.min((r.width-padding)/width,(r.height-padding)/height));
      return {r,scale,vw:r.width/(scale*c.z),vh:r.height/(scale*c.z)};
    }
    function clamp() {
      c.z=Math.max(.65,Math.min(3.5,c.z));
      if(c.z===1&&Math.abs(c.cx-width/2)<.01&&Math.abs(c.cy-height/2)<.01)return;
      c.cx=Math.max(-width*.2,Math.min(width*1.2,c.cx));
      c.cy=Math.max(-height*.2,Math.min(height*1.2,c.cy));
    }
    function apply() {
      clamp(); const {vw,vh}=geometry();
      const vb={x:c.cx-vw/2,y:c.cy-vh/2,w:vw,h:vh};
      svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
      WX.graphZoom=c.z;
      surface.classList.toggle('is-navigated',Math.abs(c.z-1)>.015||Math.abs(c.cx-width/2)>8||Math.abs(c.cy-height/2)>8);
      const help=document.getElementById('graph-interaction-help');
      if(help)help.textContent=surface.clientWidth<600?'Drag to explore · Pinch or +/− to zoom · Fit shows all':'Drag to pan · Ctrl/⌘ + scroll to zoom · 0 to fit';
      const output=document.querySelector('.graph-zoom-readout');
      if(output)output.textContent=Math.round(c.z*100)+'%';
      const mini=surface.querySelector('.minimap-window');
      if(mini){
        const x=Math.max(0,vb.x),y=Math.max(0,vb.y),right=Math.min(width,vb.x+vb.w),bottom=Math.min(height,vb.y+vb.h);
        mini.setAttribute('x',x);mini.setAttribute('y',y);mini.setAttribute('width',Math.max(1,right-x));mini.setAttribute('height',Math.max(1,bottom-y));
      }
      document.querySelector('[data-action="connected-zoom"][data-id="in"]')?.toggleAttribute('disabled',c.z>=3.5);
      document.querySelector('[data-action="connected-zoom"][data-id="out"]')?.toggleAttribute('disabled',c.z<=.65);
    }
    function fit(){c.cx=width/2;c.cy=height/2;c.z=1;apply();}
    function zoomBy(factor,point=null) {
      const {r,scale}=geometry();
      const px=point?point.x-r.left-r.width/2:0,py=point?point.y-r.top-r.height/2:0;
      const ax=c.cx+px/(scale*c.z),ay=c.cy+py/(scale*c.z);
      c.z=Math.max(.65,Math.min(3.5,c.z*factor));
      c.cx=ax-px/(scale*c.z);c.cy=ay-py/(scale*c.z);apply();
    }
    liveCamera={apply,fit,zoomBy,state:c};
    surface.addEventListener('pointerdown',ev=>{
      if(ev.target.closest('.graph-map-wrap')||ev.button>0)return;
      pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
      // Capture only after movement. A normal node click keeps its real target.
      drag={id:ev.pointerId,x:ev.clientX,y:ev.clientY,cx:c.cx,cy:c.cy};moved=false;
      if(pointers.size===2) {
        const [a,b]=[...pointers.values()],mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
        const {r,scale}=geometry();
        pinch={distance:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),z:c.z,
          ax:c.cx+(mid.x-r.left-r.width/2)/(scale*c.z),ay:c.cy+(mid.y-r.top-r.height/2)/(scale*c.z)};
      }
      if(!ev.target.closest('.dg-node')){surface.focus({preventScroll:true});ev.preventDefault();}
    },opts);
    window.addEventListener('pointermove',ev=>{
      if(!pointers.has(ev.pointerId))return;
      pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
      if(pointers.size===2&&pinch) {
        const [a,b]=[...pointers.values()],mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
        const {r,scale}=geometry();
        c.z=Math.max(.65,Math.min(3.5,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.distance));
        c.cx=pinch.ax-(mid.x-r.left-r.width/2)/(scale*c.z);
        c.cy=pinch.ay-(mid.y-r.top-r.height/2)/(scale*c.z);
        moved=true;surface.classList.add('is-panning');apply();return;
      }
      if(!drag||drag.id!==ev.pointerId)return;
      const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;
      if(!moved&&Math.hypot(dx,dy)<5)return;
      moved=true;surface.classList.add('is-panning');
      const {scale}=geometry();
      c.cx=drag.cx-dx/(scale*c.z);c.cy=drag.cy-dy/(scale*c.z);apply();
      if(ev.cancelable)ev.preventDefault();
    },{...opts,passive:false});
    function release(ev) {
      if(!pointers.has(ev.pointerId))return;
      pointers.delete(ev.pointerId);
      if(moved)suppressClickUntil=performance.now()+350;
      if(!pointers.size){drag=null;pinch=null;surface.classList.remove('is-panning');}
      else {
        const [id,p]=[...pointers.entries()][0];
        pinch=null;drag={id,x:p.x,y:p.y,cx:c.cx,cy:c.cy};
      }
    }
    window.addEventListener('pointerup',release,opts);
    window.addEventListener('pointercancel',release,opts);
    surface.addEventListener('dblclick',ev=>{
      if(!ev.target.closest('.dg-node,.graph-map-wrap')){ev.preventDefault();fit();}
    },opts);
    surface.addEventListener('wheel',ev=>{
      if(ev.ctrlKey||ev.metaKey){ev.preventDefault();zoomBy(Math.exp(-ev.deltaY*.003),{x:ev.clientX,y:ev.clientY});}
      else if(ev.shiftKey){ev.preventDefault();const {scale}=geometry();c.cx+=(ev.deltaX||ev.deltaY)/(scale*c.z);apply();}
      // A regular wheel scroll still scrolls the page, not a trapped graph region.
    },{...opts,passive:false});
    surface.addEventListener('keydown',ev=>{
      if(ev.target!==surface)return;
      const moves={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
      if(moves[ev.key]){ev.preventDefault();const {scale}=geometry();c.cx+=moves[ev.key][0]*65/(scale*c.z);c.cy+=moves[ev.key][1]*65/(scale*c.z);apply();}
      else if(['+','=','-','0','f','F'].includes(ev.key)){ev.preventDefault();if(['0','f','F'].includes(ev.key))fit();else zoomBy(ev.key==='-'?.8:1.25);}
    },opts);
    const mini=surface.querySelector('.graph-minimap');
    mini?.addEventListener('click',ev=>{
      if(ev.detail===0){fit();return;}
      const msvg=mini.querySelector('svg');
      const p=msvg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;
      const matrix=msvg.getScreenCTM();if(!matrix)return;
      const world=p.matrixTransform(matrix.inverse());c.cx=world.x;c.cy=world.y;apply();
    },opts);
    const resizeObserver=new ResizeObserver(()=>apply());resizeObserver.observe(surface);
    
    disposeViewport=()=>{controller.abort();resizeObserver.disconnect();surface.classList.remove('is-panning');};
    apply();
  }

  const oldGraphSelect=actions['graph-select'];
  actions['graph-select']=id=>{
    const keyboardFocus=document.activeElement?.dataset.nodeId===id;
    oldGraphSelect(id);
    if(keyboardFocus)document.querySelector(`.dg-node[data-node-id="${CSS.escape(id)}"]`)?.focus({preventScroll:true});
  };
  const closeBeforePolish=closeModal;
  closeModal=function(){closeBeforePolish();if(graphExpanded)document.body.style.overflow='hidden';};
  actions['close-modal']=closeModal;

  // Suppress the click generated at the end of a drag, not ordinary node clicks.
  document.addEventListener('click',ev=>{
    if(performance.now()<suppressClickUntil&&ev.target.closest('.graph-surface')){
      ev.preventDefault();ev.stopImmediatePropagation();
    }
  },true);
  document.addEventListener('keydown',ev=>{
    if(ev.key==='Escape'&&graphExpanded&&!ui.modal){ev.preventDefault();setExpanded(false);}
    if(ev.key==='Tab'&&graphExpanded&&!ui.modal){
      const items=[...document.querySelectorAll('.graph-stage button:not(:disabled),.graph-stage [tabindex="0"]')].filter(el=>el.getClientRects().length&&getComputedStyle(el).visibility!=='hidden');
      if(!items.length)return;
      const first=items[0],last=items.at(-1);
      if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}
      else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}
    }
  },true);

  const renderBeforePolish=render;
  render=function() {
    const menuScroll=document.querySelector('.sidebar-nav')?.scrollTop||0;
    disposeViewport();
    if(ui.page!=='graph'||ui.view!=='advisor') {
      if(graphExpanded){graphExpanded=false;document.body.style.overflow=rememberedBodyOverflow;}
    }
    renderBeforePolish();
    const nav=document.querySelector('.sidebar-nav');if(nav)nav.scrollTop=menuScroll;
    initViewport();
  };
  const themeBeforePolish=actions.theme;
  actions.theme=()=>{themeBeforePolish();if(graphExpanded)document.body.style.overflow='hidden';};
  window.ConnectedWorkspace.version='2.1';
  window.ConnectedWorkspace.getGraphCamera=()=>liveCamera?({...liveCamera.state,expanded:graphExpanded,view:WX.graphView}):null;
  window.ConnectedWorkspace.fitGraph=()=>liveCamera?.fit();
})();

extended();persist();render();

</script>
</body>
</html>
