/*
 * Duty Graph / Graphite revision 2.1
 * Color has a job: blue = evidence, amber = uncertainty, sage = confirmed.
 * Work surfaces and navigation stay neutral. No live services are added.
 */
:root,[data-theme=dark] {
  --bg:#131416; --surface:#1b1c1f; --surface-raised:#222327;
  --ink:#f0eeea; --muted:#aeafb5; --faint:#8b8e97;
  --line:#323338; --soft:#25262b; --nav:#101113; --nav-muted:#93959e;
  --green:#a1bea5; --green-hover:#b9ceb9; --green-light:#242e28; --lime:#a1bea5;
  --amber:#e2b57c; --amber-bg:#30281f; --red:#e5a09a; --red-bg:#322423;
  --blue:#a0c1df; --blue-bg:#222c36;
  --primary:#e7e3db; --primary-hover:#f4f0e8; --primary-ink:#222222;
  --selection:#2a2b30; --selection-line:#d3cabe; --focus:#c1d0e2;
  --edge:#606570; --edge-muted:#45484f; --node:#22242a; --node-border:#4a4e58;
  --canvas:#17181c; --grid:#303239; --scroll-thumb:#44474f; --scroll-hover:#666a73;
  --shadow:0 20px 65px #0008; --radius:12px;
  color-scheme:dark; accent-color:var(--green);
}
[data-theme=light] {
  --bg:#f3f2ef; --surface:#fffefa; --surface-raised:#ffffff;
  --ink:#25262a; --muted:#575b64; --faint:#6a6e77;
  --line:#d9d9d7; --soft:#eeede9; --nav:#eeeDE9; --nav-muted:#666973;
  --green:#416e51; --green-hover:#30543d; --green-light:#e7efe7; --lime:#416e51;
  --amber:#815622; --amber-bg:#f5ecdf; --red:#a3443e; --red-bg:#f8e8e5;
  --blue:#3a6186; --blue-bg:#e7eef6;
  --primary:#303237; --primary-hover:#18191c; --primary-ink:#fffefa;
  --selection:#dfdfdc; --selection-line:#575b64; --focus:#355f8c;
  --edge:#8c919b; --edge-muted:#c0c2c7; --node:#fffefa; --node-border:#b8bbc3;
  --canvas:#f4f3f0; --grid:#dddedf; --scroll-thumb:#b9bbc1; --scroll-hover:#9397a0;
  --shadow:0 20px 65px #30333c18; color-scheme:light;
}
html { scrollbar-gutter:stable; }
html,body { background:var(--bg); color:var(--ink); }
body { -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
*,*::before,*::after { box-sizing:border-box; }
/* Small, quiet scrollbars wherever native scrolling is useful. */
* { scrollbar-width:thin; scrollbar-color:var(--scroll-thumb) transparent; }
::-webkit-scrollbar { width:7px; height:7px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--scroll-thumb); border:2px solid transparent; background-clip:padding-box; border-radius:10px; }
::-webkit-scrollbar-thumb:hover { background-color:var(--scroll-hover); }
::-webkit-scrollbar-corner { background:transparent; }
::selection { background:#819cb34a; color:var(--ink); }
h1,h2,h3 { color:var(--ink); }
[data-theme] .app-shell { grid-template-columns:230px minmax(0,1fr); }
[data-theme] .sidebar {
  width:230px; height:100dvh; padding:22px 12px 12px;
  background:var(--nav); border-right:1px solid var(--line);
  overflow:hidden; gap:0;
}
.sidebar-header { flex:0 0 auto; }
.sidebar-nav { min-height:0; flex:1 1 auto; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; overscroll-behavior:contain; padding:0 1px 10px; }
.sidebar-nav::-webkit-scrollbar { display:none; width:0; }
[data-theme] .brand { color:var(--ink); font-size:21px; letter-spacing:-.8px; padding:0 9px; }
[data-theme] .brand small { color:var(--faint); font-size:8px; letter-spacing:1.9px; }
[data-theme] .brand-mark { border-color:var(--line); background:var(--surface); padding:8px; }
[data-theme] .brand svg { color:#b6bcb1; }
[data-theme=light] .brand svg { color:#526657; }
[data-theme] .engagement-switch { background:var(--surface); border-color:var(--line); margin:23px 0 19px; padding:12px 10px; }
[data-theme] .engagement-switch .initial { background:var(--soft); color:var(--ink); border-color:var(--node-border); border-radius:7px; }
[data-theme] .engagement-switch .company-short { color:var(--ink); font-size:12px; }
[data-theme] .engagement-switch .muted { color:var(--faint); }
[data-theme] .nav-label { margin:20px 0 7px; padding-left:12px; color:var(--faint); font-size:8px; letter-spacing:1.35px; }
[data-theme] .nav-item { min-height:40px; padding:10px 12px; color:var(--muted); font-size:12px; border-radius:7px; }
[data-theme] .nav-item:hover { background:var(--surface); color:var(--ink); }
[data-theme] .nav-item.active { background:var(--selection); color:var(--ink); box-shadow:inset 2px 0 var(--selection-line); }
[data-theme] .nav-item.active .icon { color:var(--ink); }
[data-theme] .nav-item.active::after { background:var(--selection-line); width:4px; height:4px; }
[data-theme] .nav-count { background:var(--amber-bg); color:var(--amber); }
[data-theme] .sidebar-bottom { flex:0 0 auto; padding-top:8px; margin-top:0; border-top:1px solid var(--line); }
[data-theme] .sidebar-bottom .nav-item { min-height:34px; padding:8px 12px; font-size:11px; }
[data-theme] .prototype-nav { background:transparent; border:0; padding:8px 10px 1px; margin:4px 0 0; color:var(--faint); font-size:9px; }
[data-theme] .prototype-nav .dot { color:var(--faint); width:4px; height:4px; }
[data-theme] .profile { border-color:var(--line); margin-top:10px; padding:13px 10px 3px; color:var(--ink); }
[data-theme] .profile .avatar { background:var(--soft); color:var(--ink); border:1px solid var(--node-border); }
.profile small { color:var(--faint); font-size:10px; display:block; margin-top:4px; }
[data-theme] .avatar { background:var(--soft); color:var(--ink); }
[data-theme] .avatar.blue { background:var(--blue-bg); color:var(--blue); }
[data-theme] .avatar.amber { background:var(--amber-bg); color:var(--amber); }
[data-theme] .avatar.rose { background:var(--red-bg); color:var(--red); }
[data-theme] .topbar { background:var(--bg)!important; border-color:var(--line); height:68px; }
[data-theme] .topbar .crumb-mark,[data-theme] .top-demo .dot { background:var(--faint); color:var(--faint); }
[data-theme] .top-demo { color:var(--faint); border-color:var(--line); font-size:9px; }
[data-theme] .mode-select { background:var(--surface); color:var(--muted); border-color:var(--line); }
[data-theme] .page { padding:32px 32px 25px; }
[data-theme] .page-head { margin-bottom:26px; }
[data-theme] .page-head h1 { font-size:31px; font-weight:560; letter-spacing:-1.05px; line-height:1.25; }
[data-theme] .page-head p { font-size:12px; color:var(--muted); line-height:1.75; }
[data-theme] .page-head .eyebrow { color:var(--faint)!important; font-size:9px; letter-spacing:1.6px; margin-bottom:11px; }
[data-theme] .btn,[data-theme] .icon-btn { background:var(--surface); color:var(--ink); border-color:var(--line); }
[data-theme] .btn:hover,[data-theme] .icon-btn:hover { background:var(--soft); border-color:var(--node-border); }
[data-theme] .btn.primary,[data-theme] .map-register .btn.primary,
[data-theme] .raw-recorder .btn.record-button { background:var(--primary); border-color:var(--primary); color:var(--primary-ink); }
[data-theme] .btn.primary:hover,[data-theme] .raw-recorder .btn.record-button:hover { background:var(--primary-hover); border-color:var(--primary-hover); }
[data-theme] .btn.dark { background:var(--soft); border-color:var(--line); color:var(--ink); }
[data-theme] .btn.ghost { background:transparent; border-color:transparent; color:var(--muted); }
[data-theme] .btn.ghost:hover { background:var(--soft); color:var(--ink); }
[data-theme] .btn.light-green { background:var(--soft); color:var(--ink); border-color:var(--node-border); }
[data-theme] .btn.danger { color:var(--red); background:var(--red-bg); border-color:color-mix(in srgb,var(--red) 30%,var(--line)); }

function shell(content){const e=E(),returned=e.requests.filter(r=>r.status==='returned').length;return `<div class="app-shell"><aside class="sidebar ${ui.mobile?'open':''}" aria-label="Advisor navigation"><div class="brand">${logo()}<div>Duty Graph<small>ADVISOR WORKSPACE</small></div></div><button class="engagement-switch" data-action="switch-engagement"><span class="initial">${esc(e.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</span><span class="grow"><span class="company-short">${esc(e.shortName)}</span><span class="muted" style="display:block">${esc(e.code)}</span></span>${icon('down')}</button><div class="nav-label">WORKSPACE</div>${nav('overview','Audit overview','overview')}${nav('requests','Requests & responses','inbox',returned)}<div class="nav-label">THE AUDIT PROTOCOL</div>${DG_STEPS.map((s,i)=>`<button class="nav-item ${ui.page===s.id?'active':''}" data-action="nav" data-id="${s.id}" ${ui.page===s.id?'aria-current="page"':''}><span class="nav-num">0${i+1}</span><span>${s.label}</span></button>`).join('')}<div class="nav-label">THE ORGANIZATIONAL RECORD</div>${nav('graph','Duty Graph','graph')}<div class="sidebar-bottom">${nav('protocol','Protocol & settings','settings')}<div class="protocol-badge"><span class="dot" style="color:#b5d68e"></span>Protocol v0.1 <span style="margin-left:auto">Local demo</span></div><div class="profile">${avatar({name:'Matt Roberson'})}<div><div style="font-size:12px">Matt Roberson</div><div style="font-size:10px;color:#93aba0;margin-top:3px">Tier 4 Intelligence</div></div></div></div></aside><div class="mobile-nav-scrim" data-action="mobile"></div><div class="content-shell"><header class="topbar"><div class="row"><button class="icon-btn mobile-menu" aria-label="Open navigation" data-action="mobile">${icon('menu')}</button><div class="breadcrumb"><span class="parent">Engagements</span><span class="sep">/</span><strong>${esc(title())}</strong></div></div><div class="top-actions"><button class="search-button" data-action="search">${icon('search')}<span>Find a task or person</span><kbd class="keycap">⌘ K</kbd></button><div class="view-toggle" aria-label="Prototype perspective"><button class="active" data-action="advisor">${icon('user')}Advisor</button><button data-action="client">${icon('eye')}Client preview</button></div><button class="icon-btn" data-action="theme" aria-label="Toggle dark mode" title="Toggle dark mode">${icon(document.documentElement.dataset.theme==='dark'?'sun':'moon')}</button><button class="icon-btn help-button" data-action="tour" aria-label="How this audit works">${icon('help')}</button></div></header><main class="page" id="main-content">${content}<footer class="page-footer"><span class="prototype-label">${icon('lock')} ${e.sample?'Illustrative engagement':'Local engagement'} · No emails sent · ${storageOK?'Saved in this browser':'Session only'}</span><span>AI proposes. People confirm. Evidence stays attached.</span></footer></main></div></div>`;}
function nav(id,label,ic,n=0){return `<button class="nav-item ${ui.page===id?'active':''}" data-action="nav" data-id="${id}" ${ui.page===id?'aria-current="page"':''}>${icon(ic)}<span>${label}</span>${n?`<span class="nav-count">${n}</span>`:''}</button>`;}
function journey(){const stages=stageStatuses();return `<div class="journey">${DG_STEPS.map((s,i)=>`<button class="journey-step ${stages[i]==='Complete'?'done':''} ${s.id===ui.page||(ui.page==='overview'&&i===2)?'active':''}" data-action="nav" data-id="${s.id}"><span class="step-dot">${stages[i]==='Complete'?icon('check'):i+1}</span><span><strong>${s.short}</strong><small>${stages[i]}</small></span></button>`).join('')}</div>`;}
function stageStatuses(){const e=E();return [e.scopeApproved&&e.kickoffDone?'Complete':'Set the scope',e.evidence.length?'In progress':'Collect accounts',activeTasks().some(t=>!t.reviewed)?'Needs review':'Review claims',activeTasks().length&&activeTasks().every(confirmed)?'Complete':'Ask the owners',e.snapshots.length?'Snapshot saved':'Findings first',e.signals.length?'Changes to check':'Ongoing'];}
function overview(){const e=E(),tasks=activeTasks(),ret=e.requests.filter(r=>r.status==='returned'),wait=e.requests.filter(r=>r.status==='sent'),draft=e.requests.filter(r=>r.status==='draft'),cf=tasks.filter(t=>t.conflict),c=tasks.filter(confirmed).length;return pageHead('Your audit, at a glance',e.name,`${e.scope} · ${e.people.length} participants · ${new Set(e.people.map(p=>p.team)).size} teams in this engagement`,btn('How the audit works','tour','','','help')+btn('New request','compose','','primary','plus'))+journey()+`<div class="metric-grid">${metric('Ready for your review',ret.length,'Client responses, not yet accepted','reply','requests','returned')}${metric('Waiting on the client',wait.length,'Each request has a named recipient','clock','requests','sent')}${metric('Tasks confirmed',c,`Of ${tasks.length} tasks in this audit scope`,'shield','validate','',`<span>/ ${tasks.length}</span>`)}${metric('Unresolved conflicts',cf.length,'Preserved until evidence supports a decision','alert','reconcile')}</div><div class="two-col"><div class="stack"><section class="next-card"><div class="next-icon">${icon(ret.length?'inbox':'compass')}</div><div class="grow"><div class="eyebrow">YOUR NEXT BEST ACTION</div><h2>${ret.length?`Review ${esc(name(ret[0].recipientId).split(' ')[0])}’s response`:'Move the audit forward'}</h2><p>${ret.length?'Read the original account, link it to the work, and decide what still needs confirmation. A returned answer is evidence, not automatic truth.':'Start with a bounded scope, then invite the people who actually do the work.'}</p><div class="row wrap mt16">${ret.length?btn('Review response','review-response',ret[0].id,'dark','arrow'):btn('Open scope & kickoff','nav','prepare','dark','arrow')}<span class="small muted">${ret.length?'Nothing is shared with the client at this step.':'Keep the first audit focused.'}</span></div></div></section><section class="card"><div class="card-head"><div><h2>Keep the work moving</h2><p>What needs you, and what is waiting on someone else.</p></div>${badge('Advisor queue')}</div>${cf.length?queueRow('alert','amber','Resolve the supplier-approval conflict','Procurement and Finance describe different decision owners.','Review conflict','conflict',cf[0].id):''}${draft.length?queueRow('send','green',`${draft.length} request${draft.length!==1?'s':''} ready to prepare`,'Review exactly what the client will receive before sending.','Review draft','request',draft[0].id):''}${tasks.some(t=>t.reviewed&&!confirmed(t)&&!t.conflict)?queueRow('shield','blue','Collect the missing confirmations','The task performer and accountable owner confirm the same version.','Open confirmations','nav','validate'):''}${queueRow('graph','green','See the work taking shape',`${tasks.length} tasks, ${e.duties.length} duties, with every open issue still visible.`,'Open Duty Graph','nav','graph')}</section><section class="card"><div class="card-head"><div><h2>One request. One clear return path.</h2><p>No chasing through email threads or wondering what happens next.</p></div>${btn('Try the client view','client','','ghost sm','external')}</div><div class="loop">${[['send','You prepare','Review & send'],['user','Client responds','Their own simple page'],['layers','You reconcile','Evidence & corrections'],['shield','Owners confirm','Versioned work record']].map((a,i)=>`<div class="loop-stage"><span class="loop-number">0${i+1}</span>${icon(a[0])}<strong>${a[1]}</strong><small>${a[2]}</small></div>`).join('')}</div></section></div><aside class="stack overview-right"><section class="card"><div class="card-head"><div><h2>The graph is the record.</h2><p>The protocol is how you earn it.</p></div>${icon('graph')}</div><div class="mini-map">${miniGraph()}</div><div class="card-foot row between"><span>${c} confirmed · ${tasks.length-c} not yet confirmed</span>${btn('Explore','nav','graph','ghost sm','arrow')}</div></section><section class="card card-pad"><h2 style="font-size:14px">What we can actually support</h2><p class="small muted mt8">Coverage is scoped. Confirmation is not a probability score.</p><div class="mt20">${quality('Human confirmation',c,tasks.length)}${quality('Advisor review',tasks.filter(t=>t.reviewed).length,tasks.length)}${quality('Attached evidence',tasks.filter(t=>t.evidenceIds.length).length,tasks.length)}</div><div class="summary-nudge">${icon('compass')}<span>This maps <strong>${esc(e.scope.toLowerCase())}</strong>, not the whole company.</span></div></section><section class="card card-pad"><div class="row between mb16"><h2 style="font-size:14px">Recent activity</h2>${icon('clock')}</div><div class="activity-list">${e.activity.slice(0,4).map(a=>`<div class="activity-item"><span class="activity-dot"></span><div><p>${esc(a.text)}</p><small>${prettyDate(a.at)} · ${a.at===e.activity[0].at?'Latest update':'Audit trail'}</small></div></div>`).join('')||'<p class="small muted">No changes yet.</p>'}</div></section></aside></div>`;}
function metric(label,n,foot,ic,page,filter='',suffix=''){return `<div class="card metric"><div class="metric-label">${label}${icon(ic)}</div><div class="metric-number">${n}${suffix}</div><button data-action="metric" data-id="${page}" data-filter="${filter}">${foot} ↗</button></div>`;}
function quality(label,n,total){return `<div class="quality-row"><div><span>${label}</span><strong>${n} / ${total}</strong></div><div class="progress-track"><span style="width:${total?n/total*100:0}%"></span></div></div>`;}
function queueRow(ic,color,heading,sub,label,action,id){return `<div class="task-row"><span class="action-icon ${color}">${icon(ic)}</span><div class="grow"><h3>${esc(heading)}</h3><p>${esc(sub)}</p></div>${btn(label,action,id,'sm','arrow')}</div>`;}
function miniGraph(){return `<svg viewBox="0 0 360 174" width="100%" role="img" aria-label="Illustrative work relationships across Procurement, Finance and Operations"><path d="M70 48H290M180 48V24" stroke="#a7b6a7" fill="none"/><g fill="#fdfefa" stroke="#d2decf"><rect x="23" y="34" width="94" height="32" rx="5"/><rect x="133" y="34" width="94" height="32" rx="5"/><rect x="243" y="34" width="94" height="32" rx="5"/></g><g font-size="10" fill="#52634e" text-anchor="middle"><text x="70" y="54">Procurement</text><text x="180" y="54">Finance</text><text x="290" y="54">Operations</text></g><path d="M70 67C70 140 180 84 180 121M180 67C180 142 290 82 290 121M70 139C150 166 226 140 275 135" stroke="#729b50" stroke-width="1.7" fill="none"/><path d="M290 66C290 104 198 95 180 122" stroke="#b47a50" stroke-dasharray="4 4" fill="none"/><g fill="#edf4e4" stroke="#94b577"><rect x="35" y="122" width="72" height="28" rx="5"/><rect x="144" y="122" width="72" height="28" rx="5"/><rect x="254" y="122" width="72" height="28" rx="5"/></g><g fill="#50733e" font-size="9" text-anchor="middle"><text x="71" y="140">Create record</text><text x="180" y="140">Check banking</text><text x="290" y="140">Activate</text></g></svg>`;}
function requestsPage(){const e=E();return pageHead('The exchange with your client','Requests & responses','Prepare a request, preview the client’s page, and review the answer here. Nothing gets lost between steps.',btn('New request','compose','','primary','plus'))+`<div class="card"><div class="tabs">${[['all','All requests'],['returned','Needs your review'],['sent','Waiting on client'],['draft','Drafts'],['accepted','Reviewed']].map(([k,label])=>`<button class="tab ${ui.filter===k?'active':''}" data-action="request-filter" data-id="${k}">${label}<span class="counter">${e.requests.filter(r=>k==='all'||r.status===k).length}</span></button>`).join('')}</div><div class="toolbar"><div class="search-input">${icon('search')}<input id="request-search" aria-label="Search requests" placeholder="Find a person or request…" value="${esc(ui.search)}"></div><span class="small muted">Draft → Sent → Returned → Reviewed</span></div><div id="request-results">${requestTable()}</div></div><div class="notice mt20">${icon('lock')}<span><strong>What the client sees:</strong> only the message and questions assigned to them. Your working notes and other people’s answers are never included in the client preview. This local demo is not an access-control system.</span></div>`;}
function requestTable(){const rs=E().requests.filter(r=>(ui.filter==='all'||r.status===ui.filter)&&(`${r.title} ${name(r.recipientId)}`.toLowerCase().includes(ui.search.toLowerCase())));if(!rs.length)return empty('No requests here','Create a request or choose another filter.',btn('Create request','compose','','primary sm','plus'));return `<div class="table-wrap"><table><thead><tr><th>Request / recipient</th><th>Kind</th><th>Next move</th><th>Due</th><th></th></tr></thead><tbody>${rs.map(r=>{const p=P(r.recipientId);return `<tr><td><div class="row">${avatar(p)}<div><button class="request-title" data-action="request" data-id="${r.id}">${esc(r.title)}</button><div class="small muted mt8">${esc(p?.name)} · ${esc(p?.role)}</div></div></div></td><td>${esc(DG_TYPES[r.type]?.label||r.type)}</td><td>${badge(...reqStatus(r))}</td><td class="small muted">${prettyDate(r.due)}</td><td><div class="table-actions">${r.status==='returned'?btn('Review answer','review-response',r.id,'sm light-green','arrow'):r.status==='draft'?btn('Prepare to send','request',r.id,'sm','send'):r.status==='sent'?btn('Open client page','client-request',r.id,'sm','eye'):btn('View record','request',r.id,'sm','file')}</div></td></tr>`}).join('')}</tbody></table></div>`;}
function preparePage(){const e=E();return pageHead('01 / Prepare','Start with a clear boundary.','Agree what you are mapping before asking people to describe their work.',btn('Prepare kickoff request','compose-kickoff','','primary','send'))+`<div class="two-col"><div class="stack"><form id="scope-form" class="card"><div class="card-head"><div><h2>The engagement brief</h2><p>This becomes the shared context for every interview and finding.</p></div>${badge(e.scopeApproved?'Scope agreed':'Draft scope',e.scopeApproved?'green':'amber')}</div><div class="card-pad form-grid">${field('Company','company',e.name)}${field('Website','website',e.website,'url')}${field('What work are we mapping?','scope',e.scope,'text',true)}${field('What should improve?','goal',e.goal,'textarea',true)}${field('What is outside this audit?','outOfScope',e.outOfScope,'textarea',true)}<div class="field"><label for="sponsorId">Client sponsor</label><select class="control" id="sponsorId" name="sponsorId" required>${personOptions(e.sponsorId)}</select></div><div class="field"><label for="headcount">Company employees (context only)</label><input class="control" id="headcount" type="number" min="1" name="headcount" value="${e.headcount||''}"><small>Not the denominator for audit coverage.</small></div><label class="check-label field full"><input type="checkbox" name="scopeApproved" ${e.scopeApproved?'checked':''}>The sponsor has agreed to this audit scope.</label></div><div class="card-foot row between"><span>Public research is a hypothesis, not established work or authority.</span><button class="btn primary" type="submit">Save brief ${icon('check')}</button></div></form><form id="kickoff-form" class="card"><div class="card-head"><div><h2>Leadership kickoff</h2><p>Objectives → roles → systems → the first real workflow.</p></div>${badge(e.kickoffDone?'Captured':'Not captured',e.kickoffDone?'green':'')}</div><div class="card-pad"><div class="notice mb16">${icon('compass')}<span>Confirm the business outcome, reporting relationships, workflow boundaries, system owners, and who can authorize changes. Then ask employees privately how the work actually happens.</span></div><label for="kickoffNotes" class="small">Meeting notes or transcript excerpt</label><textarea class="control mt8" id="kickoffNotes" name="kickoffNotes" rows="5" required>${esc(e.kickoffNotes)}</textarea><label class="check-label mt16"><input type="checkbox" name="kickoffDone" ${e.kickoffDone?'checked':''}>Kickoff completed and participant roster checked.</label></div><div class="card-foot row between"><span>Text is saved locally. No AI transcription runs here.</span><button class="btn" type="submit">Save kickoff</button></div></form></div><aside class="stack"><section class="card"><div class="card-head"><div><h2>People in scope</h2><p>${e.people.length} participants, not the entire organization.</p></div>${btn('Add','add-person','','sm','plus')}</div>${e.people.map(p=>`<div class="task-row">${avatar(p)}<div class="grow"><h3>${esc(p.name)}</h3><p>${esc(p.role)}</p></div>${p.id===e.sponsorId?badge('Sponsor','green'):''}</div>`).join('')}</section><section class="card card-pad"><div class="eyebrow">GOOD SCOPING QUESTION</div><h2>“Where does this work start, and what tells us it is finished?”</h2><p class="small muted mt12">Map one valuable workflow all the way across the departments it touches. Expand once the method is working.</p></section></aside></div>`;}
function field(label,n,value,type='text',full=false,requiredField=true){return `<div class="field ${full?'full':''}"><label for="${n}">${label}</label>${type==='textarea'?`<textarea class="control" id="${n}" name="${n}" rows="3" ${requiredField?'required':''}>${esc(value)}</textarea>`:`<input class="control" id="${n}" name="${n}" type="${type}" value="${esc(value)}" ${requiredField?'required':''}>`}</div>`;}
function personOptions(selected='',blank=false){return (blank?'<option value="">Not established</option>':'')+E().people.map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${esc(p.name)} · ${esc(p.role)}</option>`).join('');}
function discoverPage(){const e=E();return pageHead('02 / Discover','Ask about the work, not the job description.','Send focused interviews. Ask for a recent example, the handoffs, the systems, and what happens when things go wrong.',btn('Add a source','add-evidence','','','plus')+btn('Draft interviews','draft-interviews','','primary','spark'))+`<div class="source-kinds">${[['mic','People describe','Interviews reveal declared work, exceptions and informal handoffs.'],['file','Documents prescribe','Policies describe intended procedure and authorized boundaries.'],['database','Systems configure','Permission exports describe access. They do not establish business authority.']].map(a=>`<section class="card card-pad">${icon(a[0])}<h3 class="mt12">${a[1]}</h3><p class="small muted mt8">${a[2]}</p></section>`).join('')}</div><section class="card mt24"><div class="card-head"><div><h2>Interview coverage</h2><p>Every person gets questions relevant to the work they actually touch.</p></div>${badge(`${e.people.length} in scope`)}</div><div class="table-wrap"><table><thead><tr><th>Participant</th><th>Team</th><th>Interview status</th><th>Evidence accounts</th><th></th></tr></thead><tbody>${e.people.map(p=>{const r=e.requests.find(r=>r.type==='interview'&&r.recipientId===p.id&&r.status!=='cancelled');return `<tr><td><div class="row">${avatar(p)}<div><strong>${esc(p.name)}</strong><div class="small muted mt8">${esc(p.role)}</div></div></div></td><td>${esc(p.team)}</td><td>${r?badge(...reqStatus(r)):badge('Not requested')}</td><td>${e.evidence.filter(s=>s.personId===p.id).length} sources</td><td>${r?btn(r.status==='returned'?'Review response':'View interview',r.status==='returned'?'review-response':'request',r.id,'sm','arrow'):btn('Draft interview','draft-person',p.id,'sm','plus')}</td></tr>`}).join('')}</tbody></table></div></section><div class="equal-col mt24"><section class="card card-pad"><div class="eyebrow">THE INTERVIEW PATTERN</div><h2>Start with the last real example.</h2><p class="small muted mt12">“What arrived? What did you do? In which system? What came out? Who received it next? What could you decide yourself? Tell me about the last time it went wrong.”</p><div class="summary-nudge">${icon('help')}<span>Follow gaps in the evidence. Do not use questions that coach people toward a preferred answer.</span></div></section><section class="card card-pad"><div class="row between"><h2>Evidence library</h2>${badge(`${e.evidence.length} sources`)}</div><p class="small muted mt12">Each source keeps its origin, date, visibility, and exact excerpt. All preloaded sources are illustrative.</p><div class="mt16">${e.evidence.slice(0,3).map(s=>sourceLink(s)).join('')}</div>${btn('Review all sources','evidence-library','','ghost sm','arrow')}</section></div>`;}
function sourceLink(s){return `<button class="evidence-item" style="width:100%;text-align:left" data-action="evidence" data-id="${s.id}"><span class="evidence-ref">${esc(s.id)}</span><span class="grow"><strong>${esc(s.title)}</strong><small>${esc(s.type)} · ${prettyDate(s.date)}${s.fixture?' · Example':''}</small></span>${icon('external')}</button>`;}
function reconcilePage(){const tasks=activeTasks();return pageHead('03 / Reconcile','Turn accounts into defensible claims.','Keep the original evidence. Separate the task, its accountable owner, its performer, and its authority boundaries.',btn('Add a task','new-task','','','plus'))+`<div class="card"><div class="tabs">${[['claims','Proposed work',tasks.length],['conflicts','Conflicts & gaps',tasks.filter(t=>t.conflict||!t.ownerId).length],['sources','Evidence library',E().evidence.length]].map(([k,l,n])=>`<button class="tab ${ui.tab===k?'active':''}" data-action="review-tab" data-id="${k}">${l}<span class="counter">${n}</span></button>`).join('')}</div>${ui.tab==='sources'?`<div class="card-pad">${E().evidence.map(sourceLink).join('')||empty('No sources yet','Start with an interview or a client document.')}</div>`:ui.tab==='conflicts'?tasks.filter(t=>t.conflict||!t.ownerId).map(t=>`<div class="task-row"><span class="action-icon ${t.conflict?'red':'amber'}">${icon('alert')}</span><div class="grow"><h3>${esc(t.name)}</h3><p>${esc(t.notes)}</p></div>${btn(t.conflict?'Review conflict':'Review ownership',t.conflict?'conflict':'task',t.id,'sm','arrow')}</div>`).join('')||empty('No open ownership conflicts','Continue checking the evidence before requesting confirmation.'):taskTable(tasks)}</div><div class="notice mt20">${icon('shield')}<span><strong>Review is not attestation.</strong> An advisor can prepare and reconcile a claim. Only the named participants can confirm their responsibility. Technical access alone never establishes business authority.</span></div>`;}
function taskTable(tasks){if(!tasks.length)return empty('No tasks yet','Add a source, then record the claims it supports.',btn('Add task','new-task','','primary sm','plus'));return `<div class="table-wrap"><table><thead><tr><th>Task / duty</th><th>Accountable owner</th><th>Evidence</th><th>State</th><th></th></tr></thead><tbody>${tasks.map(t=>`<tr><td><button class="request-title" data-action="task" data-id="${t.id}">${esc(t.name)}</button><div class="small muted mt8">${esc(t.id)} · ${esc(E().duties.find(d=>d.id===t.dutyId)?.name||'Duty not set')}</div></td><td>${esc(name(t.ownerId))}<div class="tiny muted mt8">Performer: ${esc(name(t.performerId))}</div></td><td>${t.evidenceIds.length} sources<div class="tiny muted mt8">Version ${t.version}</div></td><td>${badge(...taskStatus(t))}</td><td>${btn('Review','task',t.id,'sm','arrow')}</td></tr>`).join('')}</tbody></table></div>`;}
function validatePage(){const tasks=activeTasks(),ready=tasks.filter(t=>t.reviewed&&!t.conflict&&t.ownerId&&t.performerId&&!confirmed(t));return pageHead('04 / Confirm','Have the right people confirm the right version.','The accountable owner confirms responsibility. The performer confirms the actual work. Their confirmations travel with that version.',btn('Draft missing confirmations','draft-confirmations','','primary','send'))+`<div class="metric-grid">${metric('Fully confirmed',tasks.filter(confirmed).length,`Of ${tasks.length} scoped tasks`,'shield','graph')}${metric('Ready to ask',ready.length,'Reviewed, with a named owner and performer','send','validate')}${metric('Confirmation responses',E().requests.filter(r=>['confirmation','change'].includes(r.type)&&r.status==='returned').length,'Returned and waiting for advisor review','inbox','requests','returned')}${metric('Blocked by ownership',tasks.filter(t=>t.conflict||!t.ownerId||!t.performerId).length,'Never route a guess as an established fact','alert','reconcile')}</div><section class="card"><div class="card-head"><div><h2>Current-version confirmation register</h2><p>A change makes old signatures historical, not current.</p></div>${badge('Owner + performer','green')}</div><div class="table-wrap"><table><thead><tr><th>Task</th><th>Accountable owner</th><th>Performer</th><th>Status</th><th></th></tr></thead><tbody>${tasks.map(t=>`<tr><td><button class="request-title" data-action="task" data-id="${t.id}">${esc(t.name)}</button><div class="tiny muted mt8">${esc(t.id)} · v${t.version}</div></td><td>${signoff(t,t.ownerId)}</td><td>${t.performerId===t.ownerId&&t.ownerId?'<span class="small muted">Same person, same confirmation</span>':signoff(t,t.performerId)}</td><td>${badge(...taskStatus(t))}</td><td>${confirmed(t)?btn('View evidence','task',t.id,'sm','shield'):t.reviewed&&!t.conflict&&t.ownerId&&t.performerId?btn('Prepare request','confirm-task',t.id,'sm','send'):btn('Review first','task',t.id,'sm','arrow')}</td></tr>`).join('')}</tbody></table></div></section><div class="notice mt20">${icon('lock')}<span><strong>Prototype boundary:</strong> these are local demonstration attestations, not authenticated or legally signed approvals. A production system must establish recipient identity and authorization on the server.</span></div>`;}
function signoff(t,id){if(!id)return badge('Owner not established','amber');const a=t.attestations?.[id],current=currentAttestation(t,id);return `<div class="signoff">${icon(current?'check':'clock')}<span>${esc(name(id))}<small>${current?'Confirmed v'+t.version:a?'Older confirmation, v'+a.version:'Confirmation needed'}</small></span></div>`;}
function graphPage(){return pageHead('The organizational record','A map of work. With the receipts.','See how duties cross departments. Open any task to inspect its evidence, owners, boundaries, and confirmation history.',btn('Export graph','export-graph','','','download'))+`<section class="card map-card"><div class="map-toolbar"><div class="tabs" style="border:0">${[['work','Work map'],['org','Org + duties'],['register','Task register']].map(([id,label])=>`<button class="tab ${ui.graphTab===id?'active':''}" data-action="graph-tab" data-id="${id}">${label}</button>`).join('')}</div><div class="row">${badge(`${activeTasks().length} tasks`)}${ui.graphTab!=='register'?`<button class="icon-btn" aria-label="Zoom out" data-action="zoom" data-id="out">${icon('minus')}</button><span class="small mono">${Math.round(ui.zoom*100)}%</span><button class="icon-btn" aria-label="Zoom in" data-action="zoom" data-id="in">${icon('plus')}</button>${btn('Fit','zoom','fit','sm')}`:''}</div></div>${ui.graphTab==='register'?`<div class="map-register">${taskTable(activeTasks())}</div>`:`<div class="map-scroll"><div style="width:${ui.zoom*100}%;min-width:980px">${ui.graphTab==='org'?orgSvg():workSvg()}</div></div><div class="map-legend"><span><i class="legend-line"></i>Work dependency</span><span><i class="legend-line" style="background:#a6b1a3"></i>Reporting relationship</span><span><i class="legend-line" style="background:#ad7851"></i>Exception or unresolved authority</span>${badge('All agent opportunities are proposals')}</div><div class="map-caption">${icon('help')} Click a task to see who is accountable, who performs it, and the evidence supporting the current claim. This is a scoped work model, not an access grant.</div>`}</section>`;}
function wrapText(text,n=23){const words=text.split(' '),lines=[''];for(const w of words){if((lines[lines.length-1]+' '+w).trim().length>n)lines.push(w);else lines[lines.length-1]+=(lines[lines.length-1]?' ':'')+w;}return lines;}
function svgTask(t,x,y,w=173){const lines=wrapText(t.name,23);const color=t.conflict?'#aa5845':confirmed(t)?'#4b8050':'#85977d';return `<g class="map-node" tabindex="0" role="button" aria-label="Review ${esc(t.name)}" data-action="task" data-id="${t.id}"><rect x="${x}" y="${y}" width="${w}" height="105" rx="8" fill="#ffffff" stroke="${color}" stroke-width="${confirmed(t)?1.6:1}" ${t.conflict?'stroke-dasharray="5 3"':''}/><rect x="${x+12}" y="${y+14}" width="4" height="4" rx="2" fill="${color}"/><text x="${x+24}" y="${y+19}" font-size="9" fill="#7d8c76">${esc(t.id)} · ${esc(t.team)}</text>${lines.slice(0,2).map((l,i)=>`<text x="${x+13}" y="${y+42+i*16}" font-size="11" font-weight="550" fill="#263b2d">${esc(l)}</text>`).join('')}<text x="${x+13}" y="${y+84}" font-size="9" fill="${color}">${t.conflict?'Approval owner disputed':confirmed(t)?'✓ Confirmed · v'+t.version:esc(name(t.performerId).split(' ').slice(0,2).join(' '))}</text></g>`;}
function workSvg(){if(!E().sample||activeTasks().some(t=>!/^T0[1-8]$/.test(t.id)))return genericGraph();const tasks=activeTasks(),positions={T01:[36,119],T02:[241,119],T03:[447,119],T04:[653,119],T05:[859,119],T06:[859,402],T07:[447,402],T08:[241,402]};const has=id=>tasks.some(t=>t.id===id);const edges=[['T01','T02','M209 171H241',''],['T02','T03','M414 171H447',''],['T03','T04','M620 171H653',''],['T04','T05','M826 171H859',''],['T05','T06','M945 224V402',''],['T03','T07','M533 224V402','exception'],['T07','T02','M447 454H430Q414 454 414 438V270Q414 254 398 254H327V224','exception'],['T02','T08','M327 224V402','conditional'],['T08','T05','M327 507V547H1055V171H1032','conditional']];return `<svg viewBox="0 0 1120 600" width="100%" role="img" aria-label="Supplier onboarding workflow with conditional contract review and returned banking exceptions"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#7b9e5f"/></marker><marker id="arrAmber" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#b48458"/></marker></defs><rect width="1120" height="600" fill="#f7faf3"/><text x="36" y="40" fill="#718565" font-size="10" letter-spacing="1.3">${esc(E().scope.toUpperCase())}</text><text x="36" y="64" fill="#40553b" font-size="15">From a request to an active supplier, with the exceptions included.</text><text x="36" y="102" fill="#93a18a" font-size="9" letter-spacing="1">THE USUAL PATH</text>${edges.filter(a=>has(a[0])&&has(a[1])).map(a=>`<path d="${a[2]}" stroke="${a[3]?'#b48458':'#7b9e5f'}" stroke-width="1.5" fill="none" ${a[3]?'stroke-dasharray="5 5"':''} marker-end="url(#${a[3]?'arrAmber':'arr'})"/>`).join('')}<g fill="#926d44" font-size="9"><rect x="267" y="312" width="121" height="23" rx="4" fill="#f6efdf"/><text x="275" y="327">Only nonstandard terms</text><rect x="477" y="312" width="112" height="23" rx="4" fill="#f6efdf"/><text x="486" y="327">Bank-name mismatch</text></g><rect x="879" y="312" width="132" height="23" rx="4" fill="#eaf1e2"/><text x="889" y="327" font-size="9" fill="#65814f">After recorded approval</text>${tasks.filter(t=>positions[t.id]).map(t=>svgTask(t,...positions[t.id])).join('')}<text x="36" y="577" fill="#899781" font-size="9">Green relationships describe work. Dashed branches are conditional. Open authority is never silently filled in.</text></svg>`;}
function genericGraph(){const ts=activeTasks();return `<svg viewBox="0 0 1120 ${Math.max(380,Math.ceil(ts.length/4)*150+100)}" width="100%" role="img" aria-label="Task cards in the current engagement"><rect width="1120" height="100%" fill="#f7faf3"/><text x="30" y="40" font-size="13" fill="#708766">Task inventory. Dependencies have not been established.</text>${ts.map((t,i)=>svgTask(t,30+(i%4)*269,85+Math.floor(i/4)*150,225)).join('')}${!ts.length?'<text x="30" y="150" fill="#71836a" font-size="15">Add evidence and tasks to start your work map.</text>':''}</svg>`;}
function orgSvg(){const e=E(),teams=[...new Set(e.people.filter(p=>p.id!==e.sponsorId).map(p=>p.team))],duties=e.duties,sw=1020/Math.max(1,teams.length),sponsor=P(e.sponsorId),dh=116,rows=Math.ceil(duties.length/3),height=Math.max(540,390+rows*dh+65);const pos=d=>{const i=duties.indexOf(d);return [55+(i%3)*349,390+Math.floor(i/3)*dh];};return `<svg viewBox="0 0 1120 ${height}" width="100%" role="img" aria-label="Illustrative reporting scaffold with recorded duties across departments"><rect width="1120" height="${height}" fill="#f7faf3"/><text x="35" y="32" fill="#718565" font-size="10" letter-spacing="1">REPORTING SCAFFOLD + CROSS-FUNCTIONAL WORK</text><text x="35" y="54" fill="#91a084" font-size="10">Department positions are illustrative, not verified reporting lines. Duty cards come from this engagement.</text><rect x="451" y="81" width="216" height="63" rx="7" fill="white" stroke="#9faf95"/><text x="559" y="106" text-anchor="middle" font-size="12" fill="#32482e">${esc(sponsor?.name||'Sponsor not set')}</text><text x="559" y="125" text-anchor="middle" font-size="10" fill="#829179">${esc(sponsor?.role||'')}</text>${teams.map((team,i)=>{const x=50+i*sw,cx=x+sw/2;return `<path d="M559 144V187H${cx}V220" fill="none" stroke="#b5c0ae"/><rect x="${x+10}" y="220" width="${sw-20}" height="74" rx="7" fill="white" stroke="#cad4c4"/><text x="${cx}" y="245" text-anchor="middle" font-size="12" fill="#344c31">${esc(team)}</text><text x="${cx}" y="266" text-anchor="middle" font-size="10" fill="#84917c">${e.people.filter(p=>p.team===team).length} participants · ${activeTasks().filter(t=>t.team===team).length} tasks</text>`;}).join('')}${duties.flatMap(d=>{const [x,y]=pos(d),ts=activeTasks().filter(t=>t.dutyId===d.id),dteams=[...new Set(ts.map(t=>t.team))];return dteams.map(team=>{const i=teams.indexOf(team);if(i<0)return '';const sx=50+i*sw+sw/2;return `<path d="M${sx} 294C${sx} ${y-55} ${x+150} ${y-55} ${x+150} ${y}" fill="none" stroke="${d.ownerId?'#80a365':'#b48458'}" stroke-width="1.4" ${d.ownerId?'':'stroke-dasharray="4 4"'}/>`});}).join('')}${duties.map(d=>{const [x,y]=pos(d),ts=activeTasks().filter(t=>t.dutyId===d.id),lines=wrapText(d.name,36);return `<g class="map-node" tabindex="0" role="button" data-action="duty-detail" data-id="${d.id}" aria-label="Review duty ${esc(d.name)}"><rect x="${x}" y="${y}" width="300" height="88" rx="8" fill="#fdfefa" stroke="${d.ownerId?'#9ab585':'#ba976e'}" ${d.ownerId?'':'stroke-dasharray="4 4"'}/>${lines.slice(0,2).map((l,i)=>`<text x="${x+16}" y="${y+25+i*16}" fill="#436337" font-size="12">${esc(l)}</text>`).join('')}<text x="${x+16}" y="${y+69}" fill="#839077" font-size="10">${esc(name(d.ownerId))} · ${ts.length} tasks</text></g>`}).join('')}${!duties.length?'<text x="40" y="395" font-size="14" fill="#7b8d70">No duties have been recorded for this engagement yet.</text>':''}<text x="35" y="${height-20}" fill="#83927a" font-size="10">Duty accountability is a distinct claim. Task confirmations do not automatically attest a whole duty or a reporting relationship.</text></svg>`;}

function findings(){const ts=activeTasks(),out=[];for(const t of ts){if(t.conflict)out.push({title:`Unresolved authority: ${t.name}`,body:'The sources disagree. The graph does not assign an owner until a supported resolution is reviewed and confirmed.',id:t.id,color:'red'});else if(!t.ownerId)out.push({title:`Accountability gap: ${t.name}`,body:'A performer or handoff was described, but no accountable owner has been established.',id:t.id,color:'amber'});if(t.stale)out.push({title:`Re-confirmation needed: ${t.name}`,body:'A material change affected this record. Historical confirmations remain, but do not validate the new version.',id:t.id,color:'amber'});}if(E().sample&&T('T04')&&!T('T04').rejected)out.push({title:'The verification record needs a system of record',body:'The employee account describes an email result. Policy calls for a recorded verification. The approved record location remains a follow-up, not a measured finding of control failure.',id:'T04',color:'amber'});return out;}
function reportContent(){const e=E(),ts=activeTasks(),cs=ts.filter(confirmed);return `<article class="report-sheet"><div class="report-top"><div>${logo()}<span style="margin-left:9px">DUTY GRAPH</span></div>${badge('Audit workpaper · Draft','amber')}</div><div class="eyebrow mt24">${esc(e.code)} / ${e.sample?'ILLUSTRATIVE ENGAGEMENT':'LOCAL ENGAGEMENT'}</div><h1>${esc(e.scope)}</h1><p class="muted mt12">${esc(e.name)} · Prepared by Tier 4 Intelligence · ${prettyDate(now())}</p><section><h2>What this audit covers</h2><p>${esc(e.goal)}</p><p><strong>Outside scope:</strong> ${esc(e.outOfScope)}</p></section><section><h2>What is established, and what is not</h2><p>${e.people.length} participants are in scope. The register contains ${ts.length} active tasks and ${e.duties.length} duties. ${cs.length} tasks have current owner and performer confirmations. ${ts.filter(t=>t.conflict).length} tasks retain conflicting evidence and ${ts.filter(t=>!t.ownerId).length} have no established accountable owner.</p><p>This is coverage of the selected workflow, not an estimate of company-wide completeness. Client accounts, documented policy, and configured permissions remain separate evidence types.</p></section><section><h2>Findings to act on</h2>${findings().map(f=>`<div class="finding ${f.color}"><strong>${esc(f.title)}</strong><p>${esc(f.body)} Reference: ${esc(f.id)}.</p></div>`).join('')||'<p>No open findings have been recorded. This does not establish that no risks exist.</p>'}</section><section><h2>Confirmed task inventory</h2>${cs.length?`<table><thead><tr><th>Task</th><th>Accountable owner</th><th>Version</th></tr></thead><tbody>${cs.map(t=>`<tr><td>${esc(t.id)} · ${esc(t.name)}</td><td>${esc(name(t.ownerId))}</td><td>v${t.version}</td></tr>`).join('')}</tbody></table>`:'<p>No tasks meet the current confirmation requirements.</p>'}</section><section><h2>Where AI could assist</h2><p>${e.sample?'Document collection, record drafting, and exception routing are candidates for evaluation.':'No AI opportunity has been validated for this engagement. Use the recorded task boundaries to evaluate candidates.'} These are proposals, not deployed agents or permission grants. No approval, bank change, or payment authority is delegated by this audit.</p><p>Any future agent scope must be explicitly authorized, constrained by policy, limited to the task, and no broader than the delegating human’s legitimate authority.</p></section><section><h2>Evidence and limitations</h2><p>${e.evidence.length} sources are registered. No execution telemetry is connected. Interviews do not prove actual system use, access exports do not prove business authorization, and illustrative timings are not measured performance baselines. No ROI or savings estimate has been validated.</p>${e.evidence.map(s=>`<p class="small"><strong>${esc(s.id)} · ${esc(s.title)}</strong><br>${esc(s.type)} · ${prettyDate(s.date)} · ${esc(s.location)}${s.fixture?' · Illustrative source':''}</p>`).join('')}<p><strong>Local prototype:</strong> all included sample records and confirmations are demonstrations. This file does not authenticate people, send email, perform AI analysis, or enforce system access.</p></section></article>`;}
function deliverPage(){const cs=activeTasks().filter(confirmed),excluded=activeTasks().length-cs.length;return pageHead('05 / Deliver','Deliver clarity, not false certainty.','Unresolved findings belong in the report. Only confirmed current-version tasks belong in a validated snapshot.',btn('Export report','export-report','','','download')+btn('Create snapshot','snapshot','','primary','shield'))+`<div class="two-col"><div>${reportContent()}</div><aside class="stack report-side"><section class="card card-pad"><div class="eyebrow">PUBLICATION CHECK</div><h2>${cs.length} tasks qualify for a snapshot.</h2><p class="small muted mt12">${excluded} tasks will be excluded because evidence, ownership, freshness or confirmations are incomplete.</p><div class="notice mt16">${icon('file')}<span>The report can still describe all ${activeTasks().length} tasks, including open questions. It is not blocked from reporting the truth.</span></div></section><section class="card"><div class="card-head"><h2>Versioned snapshots</h2>${badge(E().snapshots.length)}</div>${E().snapshots.length?E().snapshots.map(s=>`<div class="snapshot-card"><div class="row between"><strong>${esc(s.label)}</strong>${badge(`${s.tasks.length} tasks`,'green')}</div><p class="small muted mt8">${prettyDate(s.at)} · ${s.excluded.length} excluded</p>${btn('Export snapshot','download-snapshot',s.id,'sm mt12','download')}</div>`).join(''):empty('No snapshot published','Create a frozen record of the currently confirmed subset.')}</section><section class="card card-pad"><h3>What stays human</h3><p class="small muted mt8">No “agent ready” badge overrides policy, approval limits, separation of duties, or the need for a real system owner to grant access.</p></section></aside></div>`;}
function maintainPage(){return pageHead('06 / Maintain','Keep the graph in step with the company.','A change opens a focused review. It never silently rewrites who is accountable or refreshes an old confirmation.',btn('Load example change','load-signal','','primary','plus'))+`<div class="two-col"><div class="stack"><section class="card"><div class="card-head"><div><h2>Changes that may affect the graph</h2><p>Signals are leads to investigate, not accepted facts.</p></div>${badge(`${E().signals.filter(s=>s.status==='new').length} to review`,'amber')}</div>${E().signals.length?E().signals.map(s=>`<article class="signal"><div class="row between"><div class="row">${icon(s.kind==='role'?'user':'file')}${badge(s.kind==='role'?'Role change':'Policy change',s.status==='new'?'amber':'green')}</div><span class="tiny muted">${s.fixture?'Example signal':'Manual signal'}</span></div><h2 class="mt16">${esc(s.title)}</h2><p class="small muted mt8">${esc(s.description)}</p><div class="impact mt16">${icon('graph')}<span>${s.taskIds.length} linked task${s.taskIds.length>1?'s':''} · ${s.taskIds.map(id=>esc(id)).join(', ')} · ${s.status==='new'?'Current graph unchanged':esc(s.status)}</span></div><div class="row mt16">${s.status==='new'?btn('Review impact','signal',s.id,'light-green','arrow'):btn('View affected task','task',s.taskIds[0],'sm','arrow')}</div></article>`).join(''):empty('No changes waiting','Load a clearly labeled example to see a role change invalidate the affected task and trigger re-confirmation.',btn('Load example','load-signal','','primary sm','plus'))}</section><section class="card"><div class="card-head"><div><h2>Review history</h2><p>Old versions stay attached. There is no “make everything current” button.</p></div></div><div class="card-pad">${E().activity.filter(a=>a.kind==='change').map(a=>`<div class="timeline-item"><div class="tiny muted">${prettyDate(a.at)}</div><p class="small">${esc(a.text)}</p></div>`).join('')||'<p class="small muted">Changes reviewed here will appear in the audit trail.</p>'}</div></section></div><aside class="stack"><section class="card card-pad"><div class="eyebrow">CONTINUOUS, NOT INVASIVE</div><h2>Only ask about what changed.</h2><p class="small muted mt12">A new role, policy or system workflow should trigger questions about the affected work, not another company-wide survey.</p><div class="summary-nudge">${icon('shield')}<span>Discovery gathers evidence. Humans authorize the graph update.</span></div></section><section class="card"><div class="card-head"><div><h2>Signal sources</h2><p>No external services are connected in this file.</p></div></div>${[['HR system','Role and employment changes'],['Identity platform','Permission changes'],['Policy repository','Document version changes'],['Meeting notes','New responsibilities and exceptions']].map(([a,b])=>`<div class="connector"><span class="action-icon">${icon('database')}</span><div class="grow"><h3>${a}</h3><p>${b}</p></div>${badge('Not connected')}</div>`).join('')}</section><section class="card card-pad"><h3>Review cadence</h3><p class="small muted mt8">Default review interval: ${E().settings.reviewDays} days. Risk-based intervals can be made more restrictive in production.</p>${btn('Edit settings','nav','protocol','ghost sm mt12','arrow')}</section></aside></div>`;}
function protocolPage(){return pageHead('The method behind the workspace','The protocol is the product.','A repeatable discovery and maintenance process, with explicit quality gates and a record of how every claim was established.',btn('Export workspace backup','export-backup','','','download'))+`<div class="two-col"><div class="stack">${DG_STEPS.map((s,i)=>`<section class="card step-card"><span class="step-dot">0${i+1}</span><div class="grow"><h2>${s.label}</h2><p>${s.description}</p><div class="small green mt12">${['Exit: sponsor agrees scope and named participants.','Exit: actual work accounts and source provenance are captured.','Exit: each proposed task has evidence; contradictions remain explicit.','Exit: accountable owner and performer confirm the same version.','Exit: findings, limitations and a scoped immutable snapshot are delivered.','Exit: affected versions are rechecked; historical evidence is preserved.'][i]}</div></div>${btn('Open','nav',s.id,'sm','arrow')}</section>`).join('')}</div><aside class="stack"><section class="card card-pad"><h2>Non-negotiable rules</h2>${['One accountable owner; many contributors.','Evidence is not the same as permission.','A returned answer is not automatic validation.','Material changes invalidate current confirmations.','Open conflicts stay visible in the report.','No autonomous permission grants.'].map(r=>`<div class="rule">${icon('check')}<span>${r}</span></div>`).join('')}</section><form id="settings-form" class="card card-pad"><h2>Engagement defaults</h2><div class="form-grid mt20">${field('Review every (days)','reviewDays',E().settings.reviewDays,'number')}${field('Reminder interval (days)','reminderDays',E().settings.reminderDays,'number')}</div><p class="tiny muted mt12">These are local defaults, not scheduled jobs. No automatic messages run in this prototype.</p><button class="btn primary mt16" type="submit">Save defaults</button></form><section class="card card-pad"><h2>About this prototype</h2><p class="small muted mt12">Self-contained HTML. Local browser storage. No real email, live research, model inference, authentication, audio recording, or secure recipient links.</p><p class="small muted mt12">Client preview shows the intended participant experience. It is not data isolation: someone holding this file or browser profile can inspect its local data. Use sample information only.</p>${btn('Reset sample workspace','reset','','danger mt16','refresh')}</section></aside></div>`;}

function clientView(){const p=P(ui.clientId)||E().people[0];if(!p)return shell(empty('Add a participant first','A client request needs a named recipient.',btn('Open scope','nav','prepare','primary')));ui.clientId=p.id;const raw=ui.clientRequest?R(ui.clientRequest):null;const r=raw&&raw.recipientId===p.id&&raw.status!=='draft'?clientProjection(raw):null;return `<div class="client-shell"><div class="demo-strip"><span>${icon('eye')} CLIENT EXPERIENCE PREVIEW · Same browser only. No email or authentication.</span><div class="client-person-picker"><label for="client-person">View as</label><select id="client-person">${E().people.map(a=>`<option value="${a.id}" ${a.id===p.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>${btn('Back to advisor','advisor','','sm','back')}</div><header class="client-topbar"><div class="client-brand"><span class="initial">${esc(E().name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><div><strong>${esc(E().name)}</strong><small>${esc(E().scope)} · Work discovery</small></div></div><span class="small muted">Facilitated by <strong>Tier 4 Intelligence</strong></span></header>${ui.clientSuccess?clientSuccess():r?clientResponse(r,p):clientHome(p)}</div>`;}
function clientHome(p){const all=E().requests.filter(r=>r.recipientId===p.id&&r.status!=='draft'&&r.status!=='cancelled'),todo=all.filter(r=>r.status==='sent'),done=all.filter(r=>['returned','accepted'].includes(r.status));return `<main class="client-content"><div class="client-greeting"><div class="eyebrow">YOUR PART IN THE AUDIT</div><h1>Hi ${esc(p.name.split(' ')[0])}. Let’s make your work visible.</h1><p>Your advisor has ${todo.length?`${todo.length} request${todo.length!==1?'s':''}`:'no open requests'} for you. No graph to build. Just describe what you do and check that we understood.</p></div><div class="client-grid"><div class="stack"><section class="card"><div class="card-head"><h2>Needs your input</h2>${badge(todo.length,'green')}</div>${todo.length?todo.map(r=>`<article class="client-request"><div class="row between"><span class="eyebrow">${esc(DG_TYPES[r.type].label)}</span>${badge('Due '+prettyDate(r.due))}</div><h3>${esc(r.title)}</h3><p>${esc(r.body)}</p>${btn(r.type==='confirmation'||r.type==='change'?'Check the task':'Answer the questions','client-start',r.id,'primary','arrow')}<div class="client-meta"><span>${icon('file')} ${r.taskSnapshots?.length?`${r.taskSnapshots.length} task${r.taskSnapshots.length>1?'s':''}`:`${r.questions.length} questions`}</span><span>${icon('lock')} You review before submitting</span></div></article>`).join(''):empty('You’re up to date','When your advisor needs something, it will appear here.')}</section>${done.length?`<section class="card"><div class="card-head"><h2>Already sent to your advisor</h2></div>${done.map(r=>`<div class="client-done">${icon('check')}<div class="grow"><h3>${esc(r.title)}</h3><p>${r.status==='returned'?'Waiting for advisor review':'Reviewed by your advisor'}</p></div>${btn('View','client-start',r.id,'ghost sm','arrow')}</div>`).join('')}</section>`:''}</div><aside class="stack"><div class="client-privacy">${icon('shield')}<h3>Be honest, not polished.</h3><p>We are mapping work, not rating your performance. Workarounds and unclear ownership are useful to surface.</p><p>Your answer goes to the advisor. Task summaries are shared with the relevant people for confirmation.</p><p>In this prototype, use example data only. Nothing is uploaded or emailed.</p></div><section class="card card-pad"><div class="eyebrow">WHAT HAPPENS NEXT</div><h3>You describe. We make sense of it. You check.</h3><p class="small muted mt12">Your advisor reviews the evidence and sends back small, specific statements for you to confirm or correct.</p></section></aside></div></main>`;}
function clientResponse(r,p){if(r.status!=='sent')return `<main class="client-content narrow">${btn('Your requests','client-home','','ghost sm','back')}<div class="client-greeting mt20"><div class="eyebrow">SUBMITTED RESPONSE</div><h1>${esc(r.title)}</h1><p>${r.status==='accepted'?'Your advisor has reviewed this response.':'Your response is waiting for advisor review.'}</p></div>${responseDisplay(r)}${btn('Back to your requests','client-home','','primary mt16','back')}</main>`;const draft=R(r.id).draftReply||{answers:[],decisions:{},notes:{}};const confirmation=['confirmation','change'].includes(r.type);return `<main class="client-content narrow">${btn('Your requests','client-home','','ghost sm','back')}<div class="client-steps mt20"><span class="${ui.clientStep==='answer'?'active':''}">01 ${confirmation?'Check the task':'Your answers'}</span><span class="line"></span><span class="${ui.clientStep==='review'?'active':''}">02 Review & submit</span><span class="line"></span><span>03 Back to your advisor</span></div><div class="client-greeting"><div class="eyebrow">${esc(DG_TYPES[r.type].label)} · DUE ${prettyDate(r.due).toUpperCase()}</div><h1>${esc(r.title)}</h1><p>${esc(r.body)}</p></div>${ui.clientStep==='review'?`<div class="notice mb16">${icon('eye')}<span>This is exactly what your advisor will receive. You can go back and change anything.</span></div>${responseDisplay({...r,reply:draft})}<form id="client-submit" data-id="${r.id}"><label class="check-label card card-pad"><input type="checkbox" id="client-consent" required>I have reviewed this response and understand it will be visible to my advisor in this local prototype. It does not authorize software access or AI delegation.</label><div class="response-sticky">${btn('Edit my response','client-edit','','','back')}<button class="btn primary" type="submit">Submit to advisor ${icon('send')}</button></div></form>`:`<form id="client-answer-form" data-id="${r.id}">${confirmation?r.taskSnapshots.map((s,i)=>confirmationCard(r,s,draft,i)).join(''):`<section class="card">${r.questions.map((q,i)=>`<div class="response-question"><div class="eyebrow">QUESTION ${i+1} OF ${r.questions.length}</div><h3><label for="answer-${i}">${esc(q)}</label></h3><textarea id="answer-${i}" class="control" data-answer="${i}" rows="4" placeholder="Describe a real example. It is okay to say you are not sure." required>${esc(draft.answers?.[i]||'')}</textarea></div>`).join('')}</section><div class="row mt16">${btn('Use an example response','sample-answer',r.id,'sm','file')}<span class="tiny muted">Loads labeled sample text. No AI or microphone is running.</span></div>`}<div class="response-sticky"><span class="small muted">${icon('lock')} Draft saved in this browser as you type.</span><button class="btn primary" type="submit">Review my response ${icon('arrow')}</button></div></form>`}</main>`;}
function confirmationCard(r,s,draft,i){const dec=draft.decisions?.[s.taskId]||'';return `<article class="statement-card mb16"><div class="row between"><span class="eyebrow">TASK ${i+1} OF ${r.taskSnapshots.length}</span><span class="version">${esc(s.taskId)} · v${s.version}</span></div><h3>${esc(s.name)}</h3><div class="info-pair"><span>Accountable owner</span><strong>${esc(name(s.ownerId))}</strong></div><div class="info-pair"><span>Performer</span><strong>${esc(name(s.performerId))}</strong></div><div class="info-pair"><span>Starts when</span><span>${esc(s.trigger)}</span></div><div class="info-pair"><span>Produces</span><span>${esc(s.output)}</span></div><div class="info-pair"><span>Systems</span><span>${esc(s.systems.join(', ')||'Not established')}</span></div><div class="permissions"><div><h4>Allowed within this task</h4>${s.allowed.map(a=>`<p>${icon('check')} ${esc(a)}</p>`).join('')}</div><div class="deny"><h4>Not authorized by this task</h4>${s.denied.map(a=>`<p>${icon('close')} ${esc(a)}</p>`).join('')}</div></div><p class="small muted mt12"><strong>Human checkpoint:</strong> ${esc(s.humanGate)}</p><div class="decision-grid mt20">${[['correct','This is correct'],['change','Something needs changing'],['not-mine','This is not mine'],['unsure','I’m not sure']].map(([key,label])=>`<button type="button" class="decision-btn ${dec===key?'selected':''}" data-action="client-decision" data-id="${s.taskId}" data-value="${key}" aria-pressed="${dec===key}">${icon(key==='correct'?'check':key==='unsure'?'help':'edit')}${label}</button>`).join('')}</div><label class="small muted" for="note-${s.taskId}" style="display:block;margin-top:16px">${dec&&dec!=='correct'?'Tell us what needs changing (required)':'Optional context or anything missing'}</label><textarea class="control mt8" id="note-${s.taskId}" data-note="${s.taskId}" rows="2" ${dec&&dec!=='correct'?'required':''}>${esc(draft.notes?.[s.taskId]||'')}</textarea></article>`;}
function responseDisplay(r){const reply=r.reply||{};return ['confirmation','change'].includes(r.type)?(r.taskSnapshots||[]).map(s=>`<article class="response-review"><div class="row between"><h3>${esc(s.name)}</h3><span class="version">${esc(s.taskId)} · v${s.version}</span></div>${badge({'correct':'Confirmed as written','change':'Change requested','not-mine':'Not my responsibility','unsure':'Not sure'}[reply.decisions?.[s.taskId]]||'Not answered',reply.decisions?.[s.taskId]==='correct'?'green':'amber')}<p class="mt12">${esc(reply.notes?.[s.taskId]||'No additional comments.')}</p></article>`).join(''):(r.questions||[]).map((q,i)=>`<article class="response-review"><h3>${i+1}. ${esc(q)}</h3><p>${esc(reply.answers?.[i]||'No response.')}</p></article>`).join('');}

function getSnapshot(t){return {taskId:t.id,version:t.version,name:t.name,duty:E().duties.find(d=>d.id===t.dutyId)?.name||'',ownerId:t.ownerId,performerId:t.performerId,systems:clone(t.systems),trigger:t.trigger,output:t.output,allowed:clone(t.allowed),denied:clone(t.denied),humanGate:t.humanGate};}
function defaultQuestions(p,type='interview'){if(type==='clarification')return ['What is your understanding of who owns this decision? Please name the person, role, and supporting policy or delegation.','What evidence could help resolve the uncertainty?'];if(type==='document')return ['Share a redacted text excerpt of the source, including its title, version, and date. Do not include credentials or personal information.'];if(type==='kickoff')return ['What outcome should this audit improve, and what should stay outside scope?','Who should participate? Please list names, roles, teams, and work emails.','Which workflows and systems should we discuss in the kickoff?'];return [`As ${p?.role||'a participant'}, what outcome are you accountable for within ${E().scope.toLowerCase()}?`,'Walk through the last real example. What arrived, what did you do, in which system, and who received the result?','What are you authorized to decide? What requires another person’s approval?','Describe the last exception or workaround. Who owned the next step, and what is still unclear?'];}
function newRequest({personId,type='interview',title,questions,taskSnapshots=[],relatedTaskId,body}={}){const p=P(personId)||P(E().sponsorId)||E().people[0];if(!p){toast('Add a participant first.','alert');return null;}const r={id:uid('R'),type,recipientId:p.id,title:title||(type==='interview'?`Your part in ${E().scope.toLowerCase()}`:DG_TYPES[type].label),status:'draft',due:addDays(5),body:body||'We are mapping how this work happens so the team can make ownership, handoffs and decision boundaries clear. Please describe what is actually happening, including anything you are unsure about.',questions:questions||(['confirmation','change'].includes(type)?[]:defaultQuestions(p,type)),taskSnapshots:clone(taskSnapshots),relatedTaskId:relatedTaskId||null,internalNote:'',timeline:[{at:now(),text:'Draft created. Nothing sent.'}],reply:null,createdAt:now()};E().requests.unshift(r);log(`Prepared a ${DG_TYPES[type].label.toLowerCase()} for ${p.name}.`,'request');persist();return r;}
function composeRequest(id='',type='interview',personId=''){const r=id?R(id):null;if(r&&r.status!=='draft')return requestDetail(id);if(!E().people.length){toast('Add a participant in Scope & kickoff first.','alert');return navigate('prepare');}const p=P(personId)||P(r?.recipientId)||E().people[0];const ty=r?.type||type;const q=r?.questions||defaultQuestions(p,ty);modal(r?'Prepare the request':'Create a client request','ADVISOR ONLY · DRAFT',`<form id="request-form" data-id="${esc(r?.id||'')}"><div class="form-grid"><div class="field"><label for="request-recipient">Send to</label><select class="control" id="request-recipient" name="recipientId" required ${r?.taskSnapshots?.length?'disabled':''}>${personOptions(p.id)}</select>${r?.taskSnapshots?.length?`<input type="hidden" name="recipientId" value="${p.id}">`:''}</div><div class="field"><label for="request-type">Request type</label><select class="control" id="request-type" name="type" ${r?'disabled':''}>${Object.entries(DG_TYPES).filter(([key])=>!['confirmation','change'].includes(key)||key===ty).map(([key,value])=>`<option value="${key}" ${key===ty?'selected':''}>${value.label}</option>`).join('')}</select></div>${field('Subject','request-title',r?.title||`Your part in ${E().scope.toLowerCase()}`,'text',true)}${field('Client-visible message','request-body',r?.body||'Help us understand how this work actually happens. Describe a recent example, who gets involved, and what happens when things go wrong.','textarea',true)}${field('Due date','request-due',r?.due||addDays(5),'date')}${r?.taskSnapshots?.length?`<div class="field full"><label>Exact task versions to confirm</label>${r.taskSnapshots.map(s=>`<div class="chips mt8"><span class="chip">${esc(s.taskId)} · v${s.version}</span><span>${esc(s.name)}</span></div>`).join('')}<small>Recipients and task snapshots are fixed. Create a new request after a material change.</small></div>`:`<div class="field full"><label for="request-questions">Questions, one per line</label><textarea class="control" rows="7" id="request-questions" name="questions" required>${esc(q.join('\n'))}</textarea><small>Keep each question focused. The client can answer in their own words.</small></div>`}<div class="field full"><label for="request-internal">${icon('lock')} Private advisor note</label><textarea class="control" id="request-internal" name="internalNote" rows="2" placeholder="Never included in the client message or page.">${esc(r?.internalNote||'')}</textarea></div></div><div class="form-actions mt20"><span class="hint">Saving does not send. You will review the client preview next.</span><button class="btn primary" type="submit">Save & preview ${icon('eye')}</button></div></form>`,(r?btn('Withdraw draft','cancel-request',r.id,'ghost'):btn('Cancel','close-modal','','ghost')),true);}
function requestDetail(id){const r=R(id);if(!r)return;const p=P(r.recipientId);if(r.status==='draft')return composeRequest(id);modal(r.title,`${DG_TYPES[r.type].label.toUpperCase()} · ${name(r.recipientId)}`,`<div class="row between mb16">${badge(...reqStatus(r))}<span class="small muted">Due ${prettyDate(r.due)}</span></div><p class="small muted mb16">To ${esc(p?.name)} · ${esc(p?.email)}</p><div class="client-preview-card"><p>${esc(r.body)}</p>${r.questions.length?`<div class="mt16">${r.questions.map((q,i)=>`<p class="small">${i+1}. ${esc(q)}</p>`).join('')}</div>`:''}${r.taskSnapshots?.length?`<p class="small mt12">${r.taskSnapshots.map(s=>esc(s.taskId)+' v'+s.version+': '+esc(s.name)).join('<br>')}</p>`:''}</div>${r.internalNote?`<div class="notice mt16">${icon('lock')}<span><strong>Private advisor note:</strong> ${esc(r.internalNote)}</span></div>`:''}<h3 class="mt24">Request history</h3><div class="timeline mt12">${r.timeline.map(t=>`<div class="timeline-item"><span class="tiny muted">${prettyDate(t.at)}</span><p class="small">${esc(t.text)}</p></div>`).join('')}</div>`,`${r.status==='returned'?btn('Review response','review-response',id,'primary','arrow'):r.status==='sent'?btn('Send demo reminder','remind',id,'','send'):''}${r.status==='sent'?btn('Withdraw','cancel-request',id,'ghost'):''}${r.status!=='cancelled'?btn('Open client page','client-request',id,'light-green','eye'):''}`,false,true);}

const audioSession=new Map();
const audioURLs=new Map();

function audioDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error('IndexedDB unavailable'));const r=indexedDB.open('tier4.workspace.audio.v1',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('recordings'))r.result.createObjectStore('recordings');};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function audioStore(id,blob){audioSession.set(id,blob);try{const db=await audioDB();await new Promise((res,rej)=>{const tx=db.transaction('recordings','readwrite');tx.objectStore('recordings').put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});db.close();return true;}catch(e){return false;}}
async function audioGet(id){if(audioSession.has(id))return audioSession.get(id);try{const db=await audioDB();const blob=await new Promise((res,rej)=>{const r=db.transaction('recordings').objectStore('recordings').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});db.close();if(blob)audioSession.set(id,blob);return blob;}catch(e){return null;}}
async function audioDelete(id){audioSession.delete(id);if(audioURLs.has(id)){URL.revokeObjectURL(audioURLs.get(id));audioURLs.delete(id);}try{const db=await audioDB();await new Promise((res,rej)=>{const t=db.transaction('recordings','readwrite');t.objectStore('recordings').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error);});db.close();}catch(e){}}
async function hydrateAudio(){for(const el of document.querySelectorAll('audio[data-audio-id]')){const id=el.dataset.audioId,blob=await audioGet(id);if(!el.isConnected)continue;if(blob){if(!audioURLs.has(id))audioURLs.set(id,URL.createObjectURL(blob));el.src=audioURLs.get(id);}else{const note=document.createElement('p');note.className='no-media';note.textContent='The audio is not available in this browser. It may belong to a different browser or have been cleared.';el.replaceWith(note);}}}

function stopTracks(){recorderState.stream?.getTracks().forEach(t=>t.stop());clearInterval(recorderState.timer);cancelAnimationFrame(recorderState.animation);if(recorderState.audioContext)recorderState.audioContext.close().catch(()=>{});recorderState.audioContext=null;recorderState.analyser=null;}
