name: Verify local pilot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run contracts
      - run: git diff --exit-code -- contracts/openapi.json
      - run: npm run verify
      - run: npm audit --audit-level=high
      - if: always()
        run: docker compose --env-file .env -f infra/compose.yaml down
